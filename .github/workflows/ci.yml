name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cases:
    name: Cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Run the case suite
        run: zune run zune/Cases.luau

      - name: Run the case suite with the cache absent, failing and partial
        run: zune run zune/Cases.luau "" failing

  crossings:
    name: Crossings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Walk the interleavings
        run: zune run zune/Cross.luau

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check the TypeScript definitions against the drift test
        run: npm run check

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Check formatting
        run: stylua --check src tests zune examples
