name: Headers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headers:
    name: Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Hold every module header to its module
        run: python3 scripts/headers.py
